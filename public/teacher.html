<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>教师看板 · 问不出口的那道题</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="theme-neo">
<script>
  // 跟随学生端选择的主题（黑色 / 蓝色）
  (function () {
    function apply() {
      var t = localStorage.getItem('askable.theme') === 'aurora' ? 'aurora' : 'neo';
      document.body.classList.remove('theme-neo', 'theme-aurora');
      document.body.classList.add('theme-' + t);
    }
    apply();
    window.addEventListener('storage', function (e) {
      if (e.key === 'askable.theme') apply();
    });
    window.__applyTheme = apply;
  })();
</script>
<div class="fx" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div class="teacher">
  <header class="t-hero">
    <div class="t-brand">
      <div class="logo">师</div>
      <div>
        <h1>教师看板</h1>
        <p class="t-sub">同一份记录，两种温度：学生那边是陪伴，这边是仪表盘</p>
        <div class="badges">
          <span class="bg-item live"><i></i>实时更新</span>
          <span class="bg-item">不记名</span>
          <span class="bg-item">按班 / 按课看</span>
        </div>
      </div>
    </div>
    <div class="t-actions">
      <button id="refresh" class="ghost small" type="button">刷新</button>
      <button id="csv" class="ghost small" type="button">导出 CSV</button>
      <button id="newCode" class="primary small" type="button">生成班级码</button>
      <a class="ghost small" href="/">← 学生端</a>
    </div>
  </header>

  <section class="t-toolbar">
    <label>课程
      <select id="course" class="select"></select>
    </label>
    <label>班级码
      <input id="klass" class="mini" placeholder="留空=全部" maxlength="16" />
    </label>
    <label>时间
      <select id="days" class="select">
        <option value="7" selected>近 7 天</option>
        <option value="14">近 14 天</option>
        <option value="30">近 30 天</option>
      </select>
    </label>
    <span class="t-scope" id="note">—</span>
  </section>

  <div class="grid">
    <div class="card"><div class="k">求助总次数</div><div class="v" id="mTotal">—</div></div>
    <div class="card"><div class="k">1 档 自行解决</div><div class="v" id="mD1">—</div></div>
    <div class="card"><div class="k">2 档 点拨后解决</div><div class="v" id="mD2">—</div></div>
    <div class="card"><div class="k">3 档 完整讲解</div><div class="v" id="mD3">—</div></div>
  </div>

  <div class="t-panels">
    <section class="section">
      <h3>本周卡得最多的三处 <span>TOP 3</span></h3>
      <div id="bars" class="bars"></div>
    </section>
    <section class="section">
      <h3>各门课分别问了多少</h3>
      <div id="courses" class="bars"></div>
    </section>
  </div>

  <section class="section">
    <h3>每天问了多少次 <span>近 7 天</span></h3>
    <div id="trend" class="trend"></div>
  </section>

  <section class="section t-advice">
    <h3>下周可以这样讲</h3>
    <p class="advice" id="advice">—</p>
  </section>

  <section class="section t-code">
    <h3>班级码</h3>
    <p class="note">把下面这串码告诉学生，他们填在首页「班级码」里，你就能按班查看。这串码里没有任何个人信息。</p>
    <span class="code-badge" id="codeBadge">------</span>
  </section>

  <p class="t-foot">数据只到班级和课程，不落到个人 · 匿名记录保留 7 天</p>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const code = localStorage.getItem('askable.code') || '';

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

async function get(path) {
  const r = await fetch(path, { headers: { 'x-access-code': code } });
  if (r.status === 401) {
    const v = prompt('请输入访问码（演示码 demo）');
    if (v) { localStorage.setItem('askable.code', v); location.reload(); }
    return null;
  }
  return r.json();
}

function bars(box, items, fmt) {
  box.innerHTML = '';
  const max = Math.max(...items.map((x) => (fmt ? fmt(x) : x.count)), 1);
  for (const it of items) {
    const val = fmt ? fmt(it) : it.count;
    const row = el('div', 'bar');
    row.appendChild(el('span', '', it.name || it.level || it.id));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = Math.round((val / max) * 100) + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('span', '', String(val) + (it.pct !== undefined ? '%' : '')));
    box.appendChild(row);
  }
}

async function load() {
  const course = $('#course').value;
  const klass = $('#klass').value.trim();
  const days = $('#days').value;
  const q = new URLSearchParams({ days });
  if (course) q.set('course', course);
  if (klass) q.set('class', klass);
  const r = await get('/api/report?' + q.toString());
  if (!r) return;
  $('#note').textContent = r.note || '';
  const total = (r.topErrors || []).reduce((a, b) => a + b.count, 0);
  $('#mTotal').textContent = r.sample ? String(total) : String(total);
  const d = Object.fromEntries((r.depthDist || []).map((x) => [x.level, x.pct]));
  $('#mD1').textContent = (d['1档 自行解决'] ?? 0) + '%';
  $('#mD2').textContent = (d['2档 点拨后解决'] ?? 0) + '%';
  $('#mD3').textContent = (d['3档 完整讲解'] ?? 0) + '%';
  bars($('#bars'), (r.topErrors || []).map((x) => ({ name: x.name, count: x.count })));
  bars($('#courses'), (r.courseDist || []).map((x) => ({ name: x.id, count: x.count, pct: x.pct })));
  const tr = $('#trend');
  tr.innerHTML = '';
  const rows = (r.trend && r.trend.length ? r.trend : [{ date: '—', count: 0 }]);
  const tmax = Math.max(...rows.map((x) => x.count), 1);
  for (const t of rows) {
    const col = el('div', 'tcol');
    const bar = el('div', 'tbar');
    bar.style.height = Math.max(4, Math.round((t.count / tmax) * 64)) + 'px';
    bar.title = t.date + '：' + t.count + ' 次';
    col.appendChild(bar);
    col.appendChild(el('span', '', t.date));
    tr.appendChild(col);
  }
  $('#advice').textContent = r.suggestion || '';
}

async function initCourses() {
  const data = await get('/api/courses');
  if (!data) return;
  const sel = $('#course');
  sel.innerHTML = '';
  sel.appendChild(new Option('全部课程', ''));
  for (const c of data.courses) sel.appendChild(new Option(c.name + `（${c.counts.errors} 类报错）`, c.id));
  load();
}

$('#refresh').onclick = load;
$('#course').onchange = load;
$('#days').onchange = load;
$('#klass').onchange = load;

$('#csv').onclick = () => {
  const q = new URLSearchParams({ days: $('#days').value });
  if ($('#course').value) q.set('course', $('#course').value);
  if ($('#klass').value.trim()) q.set('class', $('#klass').value.trim());
  location.href = '/api/report.csv?' + q.toString();
};

$('#newCode').onclick = () => {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  $('#codeBadge').textContent = s;
  navigator.clipboard && navigator.clipboard.writeText(s).catch(() => {});
};

initCourses();
</script>
</body>
</html>
